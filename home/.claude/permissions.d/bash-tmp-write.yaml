# Write utilities scoped to /tmp (e.g. capturing dev/build logs via tee).
bash:
  tee:
    cmd: /tmp/**
    decide: allow
    reason: tee output to /tmp (safe scratch area; common for capturing logs)
    examples:
      allow:
        - tee /tmp/build.log
        - tee -a /tmp/build.log
      ask:
        - tee /etc/hosts
        - tee build.log
