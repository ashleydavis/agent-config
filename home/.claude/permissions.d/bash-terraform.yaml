# Terraform permissions.
#
# - Commands that mutate something beyond the local machine (real
#   infrastructure, remote state, remote workspaces, stored cloud
#   credentials, remote state locks) carry no rule, so they fall through
#   to the engine's default and prompt.
# - Every other command (plan, validate, show, output, fmt, init,
#   state list/show, workspace list/show, ...) is ALLOWED when run
#   inside the project directory.
#
# The mutating ones are excluded with `not:` rather than written as `ask` rules, because `ask`
# outranks `allow` (src/ast-nodes/ast-node.ts: abstain < allow < ask < deny), so an `ask` here
# would beat a project's own `allow` and no project could ever authorise them.
bash:
  terraform:
    not:
      cmd-in:
        - apply
        - destroy
        - import
        - refresh
        - taint
        - untaint
        - force-unlock
        - test
        - login
        - logout
        - push
        - rm
        - mv
        - replace-provider
        - new
        - delete
    cwd: "${{PROJECT_DIR}}/**"
    decide: allow
    reason: Local / read-only Terraform inside the project directory
    examples:
      allow:
        # A relative cwd resolves against the project directory.
        - cmd: terraform plan
          cwd: infrastructure
        # The project root matches the cwd pattern as well as directories under it.
        - cmd: terraform plan
          cwd: .
        - cmd: terraform validate
          cwd: infrastructure
        - cmd: terraform state list
          cwd: infrastructure
      ask:
        # Mutating subcommands, suppressed by the not: block.
        - cmd: terraform apply
          cwd: infrastructure
        - cmd: terraform destroy
          cwd: infrastructure
        - cmd: terraform state rm aws_s3_bucket.example
          cwd: infrastructure
        # Outside the project tree.
        - cmd: terraform plan
          cwd: /tmp
