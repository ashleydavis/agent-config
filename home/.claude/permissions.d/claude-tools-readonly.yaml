# Readonly Claude Code built-in and MCP discovery tools.
ToolSearch:
  decide: allow
  reason: Searching for tools to use
  examples:
    allow:
      - tool ToolSearch
    ask:
      # No rule names this tool, so it prompts.
      - tool KillShell

TodoRead:
  decide: allow
  reason: Reading todo lists and task tracking
  examples:
    allow:
      - tool TodoRead

LS:
  decide: allow
  reason: Readonly directory listing
  examples:
    allow:
      - tool LS

Glob:
  decide: allow
  reason: Readonly file pattern matching
  examples:
    allow:
      - tool Glob

Grep:
  decide: allow
  reason: Readonly file content search
  examples:
    allow:
      - tool Grep

TaskOutput:
  decide: allow
  reason: Read-only access to task output
  examples:
    allow:
      - tool TaskOutput

TaskList:
  decide: allow
  reason: Read-only listing of tasks
  examples:
    allow:
      - tool TaskList

NotebookRead:
  decide: allow
  reason: Readonly notebook access
  examples:
    allow:
      - tool NotebookRead
    ask:
      - tool NotebookEdit

ListMcpResourcesTool:
  decide: allow
  reason: Read-only MCP resource listing
  examples:
    allow:
      - tool ListMcpResourcesTool

ReadMcpResourceTool:
  decide: allow
  reason: Read-only MCP resource access (despite the "Tool" suffix, it only reads)
  examples:
    allow:
      - tool ReadMcpResourceTool

WebFetch:
  decide: allow
  reason: Allow fetching any URL
  examples:
    allow:
      - webfetch https://example.com
      - webfetch https://api.github.com/repos/example/repo

WebSearch:
  decide: allow
  reason: Allow web search
  examples:
    allow:
      - tool WebSearch
