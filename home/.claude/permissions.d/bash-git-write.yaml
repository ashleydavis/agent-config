# Git operations that change state. Destructive ones are denied; publishing/history-changing ones (commit, merge, push, rebase) require approval.
bash:
  git:
    stash:
      decide: deny
      reason: Avoid losing uncommitted work

    restore:
      decide: deny
      reason: Avoid discarding uncommitted changes

    revert:
      decide: deny
      reason: Avoid creating revert commits without explicit approval

    reset:
      decide: deny
      reason: Avoid rewriting history or losing changes

    checkout:
      decide: ask
      reason: The developer wants to be able to review and approve commands like this.

    switch:
      decide: ask
      reason: The developer wants to be able to review and approve commands like this.

    clean:
      decide: deny
      reason: Avoid permanently deleting untracked files

    rebase:
      decide: ask
      reason: Rewrites commit history — confirm each rebase. Not denied because /worktree:merge needs to rebase worktree branches onto their base.

    commit:
      decide: ask
      reason: The developer wants to be able to review and approve commands like this.

    merge:
      decide: ask
      reason: The developer wants to be able to review and approve commands like this.

    push:
      decide: ask
      reason: The developer wants to be able to review and approve commands like this.
