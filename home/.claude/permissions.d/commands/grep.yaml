grep:
  description: Search file contents for patterns
  source: grep --help
  positionals:
    - kind: string
      description: Pattern to search for
    - kind: path
      description: Files to search
      variadic: true
  flags:
    e|regexp:
      arity: 1
      kind: string
      description: Match pattern
    f|file:
      arity: 1
      kind: path
      description: Read patterns from file
    m|max-count:
      arity: 1
      kind: string
      description: Stop after this many matches
    A|after-context:
      arity: 1
      kind: string
      description: Print lines of trailing context
    B|before-context:
      arity: 1
      kind: string
      description: Print lines of leading context
    C|context:
      arity: 1
      kind: string
      description: Print lines of output context
