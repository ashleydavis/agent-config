# Readonly bash utilities that observe state but never modify it.
bash:
  cat:
    cmd: "${{PROJECT_DIR}}/**"
    decide: allow
    reason: Readonly file access within current project

  ls:
    decide: allow
    reason: Readonly file system access

  pwd:
    decide: allow
    reason: Print working directory (read-only)

  cd:
    cmd: "${{PROJECT_DIR}}/**"
    decide: allow
    reason: cd targets under the project (same ./** semantics as cat/find)

  find:
    cmd: "${{PROJECT_DIR}}/**"
    decide: allow
    reason: Readonly search within current directory (relative paths only)

  wc:
    decide: allow
    reason: Counting lines/words/chars

  cut:
    decide: allow
    reason: Selecting fields/bytes/chars from text

  uniq:
    decide: allow
    reason: Deduplicating output

  head:
    decide: allow
    reason: Readonly file access

  tail:
    decide: allow
    reason: Readonly file access

  jq:
    decide: allow
    reason: JSON processing

  hcl2json:
    decide: allow
    reason: Converts HCL/Terraform to JSON on stdout; read-only

  yq:
    decide: allow
    not:
      options:
        - i|inplace
    reason: YAML processing on stdout; read-only (in-place edits with -i fall through to ask)

  awk:
    - decide: allow
      reason: awk text processing; reads input and prints to stdout
    - decide: ask
      cmd-in:
        - '/system *\(/'
      reason: awk program calls system(); may execute arbitrary commands

  sort:
    decide: allow
    reason: Sorting output

  grep:
    decide: allow
    reason: Searching file contents

  diff:
    decide: allow
    reason: Comparing files; reads only, writes to stdout

  sed:
    - cmd-in:
        - "${{PROJECT_DIR}}/**"
        - "/tmp/**"
      decide: allow
      reason: Allow sed (read or in-place edit) on files within the project directory or /tmp
    - decide: allow
      options:
        - n
      cwd-in:
        - "./"
        - "./**"
        - "/tmp"
        - "/tmp/**"
      reason: sed -n when cwd is project or /tmp
    - decide: allow
      not:
        cmd-in:
          - "**"
      reason: sed with no positional args (stdin only); not applies when any path arg exists

  echo:
    decide: allow
    reason: Just printing stuff

  sleep:
    decide: allow
    reason: Pauses execution; no side effects

  ps:
    decide: allow
    reason: Process listing; reads from /proc with no side effects

  nproc:
    decide: allow
    reason: Reports CPU count; read-only

  free:
    decide: allow
    reason: Reports memory usage; read-only

  command:
    options:
      - v
    decide: allow
    reason: Command lookup (command -v); read-only, does not execute the target

  bash:
    options:
      - n
    decide: allow
    reason: Syntax check only (bash -n / noexec); no commands are executed
