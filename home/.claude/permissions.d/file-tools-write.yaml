# Mutating file tools: Claude's Write and Edit tools, scoped to the current project tree.
write:
  path: "${{PROJECT_DIR}}/**"
  decide: allow
  reason: OK to write any files in the current project
  examples:
    allow:
      - write /project/src/index.ts
    ask:
      - write /etc/hosts

edit:
  path: "${{PROJECT_DIR}}/**"
  decide: allow
  reason: OK to edit any files in the current project
  examples:
    allow:
      - edit /project/src/index.ts
    ask:
      - edit /etc/hosts
